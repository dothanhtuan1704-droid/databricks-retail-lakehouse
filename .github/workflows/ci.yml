name: Enterprise Data Pipeline CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  code-quality-and-lint:
    name: Lint & Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Linting & Testing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python Syntax across all Databricks Notebooks
        run: |
          echo "=== [1/2] Compiling PySpark scripts in notebooks/ ==="
          python -m py_compile notebooks/01_bronze_ingestion_autoloader.py
          python -m py_compile notebooks/02_silver_transformations_scd2.py
          python -m py_compile notebooks/03_gold_star_schema_serving.py
          python -m py_compile notebooks/04_data_quality_reconciliation.py
          echo "All notebooks compiled with ZERO syntax errors!"

      - name: Lint Python Code with Flake8
        run: |
          echo "=== [2/2] Running Flake8 static analysis ==="
          # Check for Python syntax errors, break statements outside loops, etc.
          flake8 notebooks/ --count --select=E9,F63,F7 --show-source --statistics

  test-data-contracts:
    name: Unit & Data Contract Tests
    runs-on: ubuntu-latest
    needs: code-quality-and-lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run Unit & Data Contract Tests
        run: |
          python -m unittest discover tests/ -v
